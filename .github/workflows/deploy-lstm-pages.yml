name: Deploy LSTM lecture to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'LSTM-demo/dist/**'
      - '.github/workflows/deploy-lstm-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out course repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload LSTM demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: LSTM-demo/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4